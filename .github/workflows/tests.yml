name: Tests

on:
  pull_request:
    branches:
      - main
      - 1.x
      - 2.x
      - 4-dev
  push:
    branches:
      - main
      - 1.x
      - 2.x
      - 4-dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILS_ENV: test
  PGHOST: localhost
  PGUSER: postgres
  PGPORT: 5432
  POSTGRES_HOST: localhost
  POSTGRES_USERNAME: postgres
  POSTGRES_PORT: 5432
  BUNDLE_PATH_RELATIVE_TO_CWD: true
  AVO_LICENSE_KEY: license_123

jobs:
  # ----------------------------------------------------------------------------
  # Which tests this change needs
  #
  # .github/scripts/test-scope maps the changed paths to `none` (docs and
  # metadata), `skills` (shipped agent skills) or `full`. Any path it does not
  # list, a diff it cannot read, and a new branch all mean `full`.
  # ----------------------------------------------------------------------------
  scope:
    name: Test scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Classify the changed paths
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          scope=full
          # The compare API lists at most 300 files, so a list that long may be cut short.
          if [[ "$BASE" != 0000000000000000000000000000000000000000 ]] &&
            gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" > "$RUNNER_TEMP/compare.json" &&
            [[ "$(jq '.files | length' "$RUNNER_TEMP/compare.json")" -lt 300 ]]; then
            scope=$(jq -r '.files[] | .filename, (.previous_filename // empty)' "$RUNNER_TEMP/compare.json" | .github/scripts/test-scope)
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Test scope: \`$scope\`" >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------------------
  # Build assets once
  #
  # The esbuild/Tailwind output in app/assets/builds/avo is identical across the
  # Ruby/Rails matrix, so build it a single time here and share it with every
  # test job via an artifact. The test jobs then need no Node/yarn at all.
  # ----------------------------------------------------------------------------
  build_assets:
    name: Build assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Yarn install the dummy app
        run: |
          cd spec/dummy
          yarn

      - name: Yarn install
        run: yarn

      - name: Build assets
        env:
          RAILS_ENV: production
          NODE_ENV: production
        run: |
          yarn build
          yarn build:custom-js

      - uses: actions/upload-artifact@v4
        with:
          name: avo-assets
          path: app/assets/builds/avo
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Feature and request specs
  # ----------------------------------------------------------------------------
  feature:
    name: feature (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    needs: [scope, build_assets]
    if: needs.scope.outputs.scope == 'full'
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '3.4'
        rails:
          - '7.1'
          - '8.0'
        # Only the matrix corners (oldest and newest) run; the cross-combos
        # rarely surface version-specific failures the corners don't catch.
        exclude:
          - ruby: '3.3'
            rails: '8.0'
          - ruby: '3.4'
            rails: '7.1'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    env:
      RAILS_VERSION: ${{ matrix.rails }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}_ruby_${{ matrix.ruby }}.gemfile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          bundler: default
          ruby-version: ${{ matrix.ruby }}

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: avo-assets
          path: app/assets/builds/avo

      - name: Prepare database
        run: |
          # Migrate the primary database first so schema.rb is regenerated
          # once, single-threaded. Then have parallel workers load that
          # schema instead of running migrations concurrently, which races
          # on schema.rb writes (see #4564).
          bundle exec rake db:create db:migrate
          bundle exec rake parallel:create parallel:load_schema

      - name: Run tests
        id: run_tests
        run: bundle exec parallel_rspec spec/features spec/requests

      - uses: actions/upload-artifact@v4
        if: always() && steps.run_tests.outcome == 'failure'
        with:
          name: rspec_failed_screenshots_rails_${{ matrix.rails }}_ruby_${{ matrix.ruby }}
          path: |
            ./spec/dummy/tmp/screenshots
            ./spec/examples.txt

  # ----------------------------------------------------------------------------
  # System specs (sharded)
  # ----------------------------------------------------------------------------
  system:
    name: system (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }}, ${{ matrix.spec_group.display }})
    needs: [scope, build_assets]
    if: needs.scope.outputs.scope == 'full'
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '3.4'
        rails:
          - '7.1'
          - '8.0'
        spec_group:
          - name: group_1
            display: Group 1
            rspec_paths: spec/system/avo/group_1
          - name: group_2
            display: Group 2
            rspec_paths: spec/system/avo/group_2
          - name: group_3
            display: Group 3
            rspec_paths: spec/system/avo/group_3
        # Only the matrix corners (oldest and newest) run the full system suite;
        # the cross-combos rarely surface version-specific failures the corners
        # don't already catch. Halves this job class from 12 runs to 6.
        exclude:
          - ruby: '3.3'
            rails: '8.0'
          - ruby: '3.4'
            rails: '7.1'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # A group takes about 3 minutes; one hung run billed 72 minutes on this runner.
    timeout-minutes: 20

    env:
      RAILS_VERSION: ${{ matrix.rails }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}_ruby_${{ matrix.ruby }}.gemfile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          bundler: default
          ruby-version: ${{ matrix.ruby }}

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: avo-assets
          path: app/assets/builds/avo

      - name: Prepare database
        run: |
          # Migrate the primary database first so schema.rb is regenerated
          # once, single-threaded. Then have parallel workers load that
          # schema instead of running migrations concurrently, which races
          # on schema.rb writes (see #4564).
          bundle exec rake db:create db:migrate
          bundle exec rake parallel:create parallel:load_schema

      - name: Run tests
        id: run_tests
        run: bundle exec parallel_rspec ${{ matrix.spec_group.rspec_paths }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.run_tests.outcome == 'failure'
        with:
          name: rspec_failed_screenshots_rails_${{ matrix.rails }}_ruby_${{ matrix.ruby }}_${{ matrix.spec_group.name }}
          path: |
            ./spec/dummy/tmp/screenshots
            ./spec/examples.txt

  # ----------------------------------------------------------------------------
  # Components and unit specs
  # ----------------------------------------------------------------------------
  components:
    name: components (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    needs: [scope, build_assets]
    if: needs.scope.outputs.scope == 'full'
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '3.4'
        rails:
          - '7.1'
          - '8.0'
        # Only the matrix corners (oldest and newest) run; the cross-combos
        # rarely surface version-specific failures the corners don't catch.
        exclude:
          - ruby: '3.3'
            rails: '8.0'
          - ruby: '3.4'
            rails: '7.1'
    runs-on: ubuntu-latest

    env:
      RAILS_VERSION: ${{matrix.rails}}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}_ruby_${{ matrix.ruby }}.gemfile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          bundler: default
          ruby-version: ${{ matrix.ruby }}

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: avo-assets
          path: app/assets/builds/avo

      - name: Prepare database
        run: |
          bin/rails db:create db:migrate

      - name: Run tests
        id: run_tests
        # The unit-level spec dirs ride along here: every example goes through
        # the DatabaseCleaner `around` hook in spec/support/database_cleaner.rb,
        # so they need a prepared database even when the spec itself touches
        # none. This job already creates one. A spec dir listed in no job never
        # runs in CI.
        run: bundle exec rspec spec/components spec/lib spec/helpers spec/services spec/tasks spec/avo spec/gemspec_spec.rb

      - uses: actions/upload-artifact@v4
        if: always() && steps.run_tests.outcome == 'failure'
        with:
          name: rspec_failed_screenshots_rails_${{ matrix.rails }}_ruby_${{ matrix.ruby }}
          path: ./spec/dummy/tmp/screenshots

  # ----------------------------------------------------------------------------
  # i18n tests
  # ----------------------------------------------------------------------------
  i18n:
    name: i18n (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    strategy:
      matrix:
        ruby: ['3.4']
        rails: ['8.0']
    runs-on: ubuntu-latest

    env:
      RAILS_VERSION: ${{matrix.rails}}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}_ruby_${{ matrix.ruby }}.gemfile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          bundler: default
          ruby-version: ${{ matrix.ruby }}

      - name: Run tests
        id: run_tests
        run: bundle exec rspec spec/system/avo/i18n_spec.rb

      - uses: actions/upload-artifact@v4
        if: always() && steps.run_tests.outcome == 'failure'
        with:
          name: rspec_failed_screenshots_rails_${{ matrix.rails }}_ruby_${{ matrix.ruby }}
          path: ./spec/dummy/tmp/screenshots

  # ----------------------------------------------------------------------------
  # Accessibility tests
  # ----------------------------------------------------------------------------
  accessibility:
    name: accessibility (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    needs: [scope, build_assets]
    if: needs.scope.outputs.scope == 'full'
    strategy:
      matrix:
        ruby:
          - '3.3'
        rails:
          - '8.0'
    runs-on: ubuntu-latest

    env:
      RAILS_VERSION: ${{matrix.rails}}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}_ruby_${{ matrix.ruby }}.gemfile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          bundler: default
          ruby-version: ${{ matrix.ruby }}

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: avo-assets
          path: app/assets/builds/avo

      - name: Prepare database
        run: |
          bin/rails db:create db:migrate

      - name: Run tests
        id: run_tests
        run: bundle exec rspec spec/a11y

      - uses: actions/upload-artifact@v4
        if: always() && steps.run_tests.outcome == 'failure'
        with:
          name: rspec_failed_screenshots_a11y_${{ matrix.rails }}_ruby_${{ matrix.ruby }}
          path: ./spec/dummy/tmp/screenshots

  # ----------------------------------------------------------------------------
  # Skills-only changes
  #
  # A change limited to lib/avo/skills runs the specs that read those files
  # instead of the whole matrix. `full` runs them too, inside `components`.
  # ----------------------------------------------------------------------------
  skills:
    name: skills (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    needs: scope
    if: needs.scope.outputs.scope == 'skills'
    strategy:
      matrix:
        ruby: ['3.4']
        rails: ['8.0']
    runs-on: ubuntu-latest

    env:
      RAILS_VERSION: ${{ matrix.rails }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}_ruby_${{ matrix.ruby }}.gemfile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          bundler: default
          ruby-version: ${{ matrix.ruby }}

      - name: Prepare database
        run: bin/rails db:create db:migrate

      - name: Run tests
        run: bundle exec rspec spec/lib/avo/skills spec/features/avo/generators/skills_generator_spec.rb

  # ----------------------------------------------------------------------------
  # One check that holds the result of every job above
  #
  # Jobs the scope skips report as skipped, and a skipped matrix job reports
  # under its unexpanded name, so make this the check branch protection requires.
  # ----------------------------------------------------------------------------
  result:
    name: Tests result
    needs: [scope, build_assets, feature, system, components, i18n, accessibility, skills]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail when any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]
